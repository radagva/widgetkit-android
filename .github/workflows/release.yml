name: Release APK

# Runs when a version tag (e.g. 1.2.3 or v1.2.3) is pushed. The tagged commit must be on main.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make sure the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

      - name: Read version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          # 1.2.3 -> 10203 (minor and patch must stay below 100).
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret. See README / workflow docs to set up signing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify signature
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          out="WidgetKit-$VERSION_NAME.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "WidgetKit $VERSION_NAME" \
            --generate-notes \
            --notes "## Install
          Download **$APK** below on your Android phone, open it and allow installing from this source when asked.
          Requires Android 7.0 or newer."
