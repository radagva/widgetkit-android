name: Release APK

# Runs when a version tag (e.g. 1.2.3 or v1.2.3) is pushed, or manually from the Actions tab
# for an existing tag. The tagged commit must be on main.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Signing secrets live in the "production" environment.
    environment: production
    env:
      # The pushed tag, or the one typed in when dispatching manually.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag like 1.2.3 or v1.2.3."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Make sure the tag is on main
        run: |
          git fetch --no-tags origin main
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main."
            exit 1
          fi

      - name: Read version from tag
        id: version
        run: |
          name="${TAG#v}"
          IFS=. read -r major minor patch <<< "$name"
          # 1.2.3 -> 10203 (minor and patch must stay below 100).
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret in the 'production' environment (Settings > Environments > production)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify signature
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          out="WidgetKit-$VERSION_NAME.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # Catch APKs that build fine but crash at runtime (e.g. R8 issues) before publishing.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: .github/scripts/smoke-test.sh "${{ steps.apk.outputs.file }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run (e.g. manual dispatch): replace the APK on the existing release.
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --verify-tag \
              --title "WidgetKit $VERSION_NAME" \
              --generate-notes \
              --notes "## Install
          Download **$APK** below on your Android phone, open it and allow installing from this source when asked.
          Requires Android 7.0 or newer."
          fi
